name: Build Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Install deps
        run: npm ci

      - name: Catalog, credential and SQLite regression gate
        shell: bash
        run: |
          bash scripts/check_catalog_regressions.sh
          node --check src/main.js
          node --check src/preload.js
          node - <<'NODE'
          (async () => {
            const response = await fetch('https://15code.com/api/catalog');
            if (!response.ok) throw new Error(`Catalog HTTP ${response.status}`);
            const catalog = await response.json();
            if (catalog.schemaVersion !== 1 || !catalog.releases?.desktop?.stable?.minimumSupportedVersion) {
              throw new Error('Catalog release policy is incomplete');
            }
          })();
          NODE

      # image-size currently has no patched npm release for its ICNS/JXL/HEIF
      # parser advisories. Runtime image input is restricted to PNG/JPEG/WebP,
      # so keep reporting high findings while blocking critical advisories.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Detect Windows signing certificate
        id: signing
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Windows Authenticode signing enabled"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Building an explicitly unsigned Beta installer"
          fi

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.available }}

      - name: Build Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:linux

      - name: Verify Windows signature
        if: matrix.os == 'windows-latest' && steps.signing.outputs.available == 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Invalid Authenticode signature: $($signature.Status)"
          }

      - name: Verify unsigned Beta status
        if: matrix.os == 'windows-latest' && steps.signing.outputs.available != 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/*-unsigned-beta.exe | Select-Object -First 1
          if (-not $installer) { throw 'Unsigned Beta installer was not produced' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'NotSigned') {
            throw "Expected an unsigned Beta installer, got: $($signature.Status)"
          }
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          "SHA256 $($hash.Hash)  $($installer.Name)" | Tee-Object -FilePath "dist/$($installer.BaseName).sha256"

      - name: Verify Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          appimage=$(find dist -maxdepth 1 -type f -name '*.AppImage' | head -n 1)
          test -n "$appimage"
          test -s "$appimage"
          sha256sum "$appimage" | tee "${appimage}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 15code-desktop-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.yml
            dist/*.blockmap
            dist/*.sha256

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.yml
            dist/*.blockmap
            dist/*.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
