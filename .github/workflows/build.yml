name: Build Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
          with: { node-version: "22" }

      - name: Install deps
        run: npm install

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Require Windows signing certificate
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Verify Windows signature
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Invalid Authenticode signature: $($signature.Status)"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 15code-desktop-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          token: ${{ secrets.GITHUB_TOKEN }}
