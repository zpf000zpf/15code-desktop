<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<title>15code</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://new.15code.com https://claude.15code.com https://15code.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: 15code-chat-image:; object-src 'none'; base-uri 'none'; form-action 'none';">
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-card: #16161f;
  --bg-elevated: #1c1c28;
  --border: #2a2a3a;
  --border-light: #3a3a4a;
  --text-primary: #f5f5f7;
  --text-secondary: #a0a0b0;
  --text-muted: #6a6a7a;
  --accent: #6366f1;
  --accent-hover: #818cf8;
  --accent-glow: rgba(99, 102, 241, 0.3);
  --success: #10b981;
  --error: #ef4444;
  --warn: #f59e0b;
  --gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
  --shadow-glow: 0 0 40px rgba(99, 102, 241, 0.15);
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.6;
}
button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
}

/* ─── 登录页 ─── */
.login-page {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center, rgba(99,102,241,0.1) 0%, var(--bg-primary) 70%);
}
.login-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 36px 40px;
  width: 380px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.login-brand {
  font-size: 28px;
  font-weight: 700;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-align: center;
  margin-bottom: 4px;
}
.login-sub {
  text-align: center;
  color: var(--text-muted);
  margin-bottom: 28px;
  font-size: 13px;
}
.login-form label {
  display: block;
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 6px;
  margin-top: 14px;
}
.login-form input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg-secondary);
  color: var(--text-primary);
  outline: none;
  transition: border 0.2s, box-shadow 0.2s;
}
.login-form input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.login-btn {
  width: 100%;
  margin-top: 20px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: var(--gradient);
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.login-btn:hover { box-shadow: var(--shadow-glow); }
.login-btn:disabled { opacity: 0.5; cursor: wait; }
.login-links {
  margin-top: 20px;
  text-align: center;
  font-size: 12px;
  color: var(--text-muted);
}
.login-links a { color: var(--accent-hover); text-decoration: none; cursor: pointer; margin: 0 8px; }
.login-err {
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: var(--error);
  font-size: 13px;
}

/* ─── 主界面布局 ─── */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 18px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.brand {
  font-size: 18px;
  font-weight: 700;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.topbar-right { display: flex; align-items: center; gap: 12px; }
.model-pick {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 7px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  min-width: 200px;
}
.model-pick:focus { outline: none; border-color: var(--accent); }
.balance {
  color: var(--text-muted);
  font-size: 12px;
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-elevated);
}
.balance b { color: var(--accent-hover); font-weight: 600; }
.menu-btn {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  padding: 6px 10px;
  cursor: pointer;
  border-radius: 6px;
  font-size: 13px;
}
.menu-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }

/* ─── 聊天区 ─── */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px 0 16px;
}
.messages {
  max-width: 780px;
  margin: 0 auto;
  padding: 0 20px;
}
.msg {
  margin-bottom: 20px;
  animation: fade-in 0.3s;
}
@keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.msg-role {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 500;
}
.msg-role.user b { color: var(--accent-hover); }
.msg-role.assistant b { color: var(--success); }
.msg-body {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 18px;
  white-space: pre-wrap;
  word-wrap: break-word;
  line-height: 1.7;
  font-size: 14px;
}
.msg.user .msg-body { background: var(--bg-secondary); }
.msg-body code {
  background: var(--bg-elevated);
  padding: 2px 6px;
  border-radius: 4px;
  color: var(--accent-hover);
  font-family: "SF Mono", Consolas, monospace;
  font-size: 13px;
}
.msg-body pre {
  background: #0d0d14;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  overflow-x: auto;
  margin: 10px 0;
  font-family: "SF Mono", Consolas, monospace;
  font-size: 13px;
  line-height: 1.5;
}
.msg-body pre code { background: transparent; padding: 0; color: var(--text-primary); }
.msg-body h1, .msg-body h2, .msg-body h3 {
  margin: 14px 0 8px;
  line-height: 1.3;
}
.msg-body h1 { font-size: 20px; }
.msg-body h2 { font-size: 17px; }
.msg-body h3 { font-size: 15px; }
.msg-body ul, .msg-body ol { padding-left: 24px; margin: 6px 0; }
.msg-body blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text-secondary); margin: 8px 0; }
.msg-body a { color: var(--accent-hover); }
.msg-actions {
  display: flex;
  gap: 8px;
  margin-top: 6px;
  opacity: 0;
  transition: opacity 0.2s;
}
.msg:hover .msg-actions { opacity: 1; }
.msg-actions button {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
}
.msg-actions button:hover { border-color: var(--accent); color: var(--text-primary); }

.hero-empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.hero-empty h2 {
  font-size: 24px;
  margin-bottom: 8px;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* ─── 输入区 ─── */
.input-area {
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  padding: 14px 20px;
  background: var(--bg-secondary);
}
.input-wrap {
  max-width: 780px;
  margin: 0 auto;
  position: relative;
}
.attachments {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}
.attach-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 3px 10px;
  font-size: 12px;
  color: var(--text-secondary);
}
.attach-chip .x {
  cursor: pointer;
  color: var(--text-muted);
  margin-left: 4px;
}
.attach-chip .x:hover { color: var(--error); }
.input-box {
  display: flex;
  gap: 10px;
  align-items: flex-end;
}
.input-box textarea {
  flex: 1;
  min-height: 46px;
  max-height: 180px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg-card);
  color: var(--text-primary);
  resize: none;
  outline: none;
  font-size: 14px;
  line-height: 1.5;
}
.input-box textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.input-actions {
  display: flex;
  gap: 6px;
  flex-direction: column;
}
.input-btn {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  width: 46px;
  height: 46px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.input-btn:hover { border-color: var(--accent); color: var(--text-primary); }
.send-btn {
  background: var(--gradient);
  border: none;
  color: #fff;
  padding: 0 18px;
  min-width: 80px;
  height: 46px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.send-btn:hover { box-shadow: var(--shadow-glow); }
.send-btn:disabled { opacity: 0.5; cursor: wait; }
.input-hint {
  color: var(--text-muted);
  font-size: 11px;
  text-align: center;
  margin-top: 6px;
}
.input-hint kbd { background: var(--bg-elevated); padding: 1px 5px; border-radius: 3px; font-family: monospace; font-size: 10px; }

/* ─── PPT Studio ─── */
.ppt-studio {
  flex: 1;
  overflow-y: auto;
  padding: 22px;
  background: var(--bg-primary);
}
.ppt-shell {
  max-width: 1180px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 360px 1fr;
  gap: 18px;
}
.ppt-panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
}
.ppt-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
}
.ppt-subtitle {
  color: var(--text-secondary);
  font-size: 12px;
  margin-bottom: 14px;
}
.ppt-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 12px;
}
.ppt-field label {
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 600;
}
.ppt-field input,
.ppt-field select,
.ppt-field textarea {
  width: 100%;
  border: 1px solid var(--border);
  background: var(--bg-secondary);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 9px 10px;
  outline: none;
}
.ppt-field textarea {
  min-height: 96px;
  resize: vertical;
}
.ppt-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.ppt-btn {
  border: 1px solid var(--border-light);
  background: var(--bg-elevated);
  color: var(--text-primary);
  padding: 9px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
}
.ppt-btn.primary {
  border: none;
  background: var(--gradient);
  color: #fff;
}
.ppt-btn:disabled {
  opacity: .55;
  cursor: wait;
}
.ppt-output {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}
.ppt-status {
  color: var(--text-secondary);
  font-size: 12px;
  min-height: 18px;
}
.ppt-slides {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 12px;
}
.ppt-slide-card {
  min-height: 148px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg-secondary);
  padding: 12px;
}
.ppt-slide-thumb {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  object-fit: cover;
  margin-bottom: 9px;
}
.ppt-slide-thumb.empty {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 11px;
}
.ppt-slide-card h4 {
  font-size: 14px;
  line-height: 1.35;
  margin-bottom: 8px;
}
.ppt-slide-card ul {
  padding-left: 16px;
  color: var(--text-secondary);
  font-size: 12px;
}
.ppt-report {
  white-space: pre-wrap;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  color: var(--text-secondary);
}
.chat-image-controls { display:none; margin-bottom:8px; padding:9px 10px; border:1px solid var(--border); border-radius:10px; background:var(--bg-card); }
.chat-image-controls.active { display:block; }
.chat-image-controls-row { display:flex; flex-wrap:wrap; align-items:center; gap:7px; }
.chat-image-controls label { color:var(--text-muted); font-size:12px; }
.chat-image-controls select, .chat-image-controls button { border:1px solid var(--border); border-radius:7px; background:var(--bg-elevated); color:var(--text-primary); padding:5px 8px; font-size:12px; }
.chat-image-controls button { cursor:pointer; }
.chat-image-controls button:hover { border-color:var(--accent); }
.chat-image-source { flex:1; min-width:160px; color:var(--text-secondary); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chat-image-status { min-height:17px; margin-top:6px; color:var(--text-muted); font-size:12px; }
.input-btn.active { border-color:var(--accent); color:var(--accent-hover); background:rgba(99,102,241,.15); }
.image-card { overflow:hidden; border:1px solid var(--border); border-radius:10px; background:var(--bg-secondary); }
.image-card.selected { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent-glow); }
.image-card-header { display:flex; justify-content:space-between; gap:10px; padding:8px 10px; color:var(--text-secondary); font-size:12px; }
.image-card img { display:block; width:100%; max-height:560px; object-fit:contain; background:#090910; }
.image-card-caption { padding:9px 10px 0; color:var(--text-secondary); font-size:12px; white-space:pre-wrap; word-break:break-word; }
.image-card-actions { display:flex; flex-wrap:wrap; gap:7px; padding:9px 10px; }
.image-card-actions button { border:1px solid var(--border); border-radius:6px; padding:4px 9px; background:var(--bg-elevated); color:var(--text-secondary); font-size:11px; cursor:pointer; }
.image-card-actions button:hover { border-color:var(--accent); color:var(--text-primary); }
</style>
</head>
<body>

<!-- ═══════════════════════ 登录页 ═══════════════════════ -->
<div id="login-page" class="login-page">
  <div class="login-card">
    <div class="login-brand">⚡ 15code</div>
    <div class="login-sub">统一 Claude / GPT / GLM 接入</div>
    <form class="login-form" onsubmit="return doLogin(event)">
      <label>邮箱</label>
      <input id="login-email" type="email" required autocomplete="email" placeholder="you@example.com"/>
      <label>密码</label>
      <input id="login-password" type="password" required autocomplete="current-password" placeholder="••••••••"/>
      <button type="submit" class="login-btn" id="login-btn">登录</button>
    </form>
    <div class="login-err" id="login-err" style="display:none"></div>
    <div class="login-links">
      <a onclick="openLink('https://15code.com/login?mode=register')">注册账号</a>
      ·
      <a onclick="openLink('https://15code.com/forgot-password')">忘记密码？</a>
    </div>
  </div>
</div>

<!-- ═══════════════════════ 主界面 ═══════════════════════ -->
<div id="app" class="app" style="display:none">
  <!-- 顶部 -->
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="brand">⚡ 15code <span id="app-version" style="font-size:12px;color:var(--muted);font-weight:500"></span></div>
      <button class="menu-btn" onclick="newChat()" title="新建对话 (Ctrl+N)">+ 新建</button>
      <button class="menu-btn" onclick="showConversationManager()" title="搜索、置顶、重命名、删除和恢复会话">会话</button>
      <button class="menu-btn" onclick="showChatMode()" title="聊天">聊天</button>
      <button class="menu-btn" onclick="toggleChatImageMode()" title="在当前聊天中生成或修改图片">图片</button>
      <button class="menu-btn" onclick="showPptStudio()" title="PPT Studio (Ctrl+P)">PPT Studio</button>
    </div>
    <div class="topbar-right">
      <select class="model-pick" id="model-pick"></select>
      <div class="balance" id="balance-box">加载中...</div>
      <button class="menu-btn" id="update-btn" onclick="checkForUpdates()" title="检查更新">检查更新</button>
      <button class="menu-btn" onclick="exportChat()" title="导出对话 (Ctrl+S)">⬇ 导出</button>
      <button class="menu-btn" onclick="logout()" title="登出">↗ 登出</button>
    </div>
  </div>

  <!-- PPT Studio -->
  <div class="ppt-studio" id="ppt-studio" style="display:none">
    <div class="ppt-shell">
      <div class="ppt-panel">
        <div class="ppt-title">PPT Studio</div>
        <div class="ppt-subtitle">生成 PPTX、优化已有 PPT，并自动生成页面配图</div>
        <div class="ppt-field">
          <label>主题</label>
          <input id="ppt-topic" placeholder="例如：15code PPT Studio 产品方案"/>
        </div>
        <div class="ppt-field">
          <label>场景</label>
          <select id="ppt-scenario">
            <option value="business">商务汇报</option>
            <option value="sales">销售方案</option>
            <option value="training">培训课件</option>
            <option value="fundraising">融资 BP</option>
            <option value="gov">政府/国企汇报</option>
          </select>
        </div>
        <div class="ppt-field">
          <label>风格</label>
          <select id="ppt-style">
            <option value="consulting">咨询风</option>
            <option value="tech">科技深色</option>
            <option value="gov">正式红蓝</option>
          </select>
        </div>
        <div class="ppt-field">
          <label>页数</label>
          <select id="ppt-page-count">
            <option value="8">8 页</option>
            <option value="10" selected>10 页</option>
            <option value="12">12 页</option>
            <option value="15">15 页</option>
          </select>
        </div>
        <div class="ppt-field">
          <label>资料 / 要点</label>
          <textarea id="ppt-source" placeholder="粘贴资料、会议记录、产品说明。也可以先留空，只按主题生成。"></textarea>
        </div>
        <div class="ppt-field">
          <label>修改要求</label>
          <textarea id="ppt-revision" placeholder="例如：压缩到 8 页、改成投资人风格、突出价格优势、每页标题更有结论。"></textarea>
        </div>
        <div class="ppt-field">
          <label>15code 图片质量</label>
          <select id="ppt-image-engine">
            <option value="high">高清（适合封面和正式交付）</option>
            <option value="medium">标准（适合常规页面）</option>
            <option value="none">不生成图片</option>
          </select>
        </div>
        <div class="ppt-actions">
          <button class="ppt-btn primary" id="ppt-outline-btn" onclick="generatePptOutline()">生成大纲</button>
          <button class="ppt-btn" id="ppt-revise-btn" onclick="revisePptOutline()">按要求修改</button>
          <button class="ppt-btn" id="ppt-image-btn" onclick="generatePptImages()">生成配图</button>
          <button class="ppt-btn" id="ppt-quality-btn" onclick="checkPptQuality()">质量检查</button>
          <button class="ppt-btn" id="ppt-export-btn" onclick="exportPptx()">导出 PPTX</button>
          <button class="ppt-btn" id="ppt-analyze-btn" onclick="analyzePptx()">美化已有 PPT</button>
        </div>
        <div class="ppt-status" id="ppt-status"></div>
      </div>
      <div class="ppt-output">
        <div class="ppt-panel">
          <div class="ppt-title">页面预览</div>
          <div class="ppt-subtitle">AI 先生成结构化页面和配图，再由本地 PPTX 引擎渲染为可编辑文件。</div>
          <div class="ppt-slides" id="ppt-slides"></div>
        </div>
        <div class="ppt-panel">

function openLink(url) {

  else window.open(url, '_blank');

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function makeElement(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = String(text);
  return element;
}

function appendInlineMarkdown(parent, source) {
  const text = String(source || '');
  const tokens = text.split(/(`[^`]+`|\*\*[^*]+\*\*|\*[^*\n]+\*)/g);
  tokens.forEach(token => {
    if (!token) return;
    if (token.startsWith('`') && token.endsWith('`')) {
      const code = document.createElement('code'); code.textContent = token.slice(1, -1); parent.appendChild(code);
    } else if (token.startsWith('**') && token.endsWith('**')) {
      const strong = document.createElement('strong'); strong.textContent = token.slice(2, -2); parent.appendChild(strong);
    } else if (token.startsWith('*') && token.endsWith('*')) {
      const em = document.createElement('em'); em.textContent = token.slice(1, -1); parent.appendChild(em);
    } else parent.appendChild(document.createTextNode(token));
  });
}

// The renderer never parses model text or persisted metadata as HTML.  This small
// DOM renderer intentionally supports the formatting already advertised by the app
// without creating an injection sink.
function renderMarkdownInto(container, markdown) {
  container.replaceChildren();
  const lines = String(markdown || '').split('\n');
  let codeLines = null;
  let language = '';
  const flushCode = () => {
    if (!codeLines) return;
    const pre = document.createElement('pre');
    const code = document.createElement('code');
    if (/^[A-Za-z0-9_-]{1,32}$/.test(language)) code.className = 'lang-' + language;
    code.textContent = codeLines.join('\n'); pre.appendChild(code); container.appendChild(pre);
    codeLines = null; language = '';
  };
  lines.forEach((line, index) => {
    const fence = line.match(/^```([A-Za-z0-9_-]{0,32})\s*$/);
    if (fence) {
      if (codeLines) flushCode(); else { codeLines = []; language = fence[1] || ''; }
      return;
    }
    if (codeLines) { codeLines.push(line); return; }
    const heading = line.match(/^(#{1,3})\s+(.+)$/);
    const node = heading ? document.createElement('h' + heading[1].length) : document.createElement('span');
    appendInlineMarkdown(node, heading ? heading[2] : line);
    container.appendChild(node);
    if (!heading && index < lines.length - 1) container.appendChild(document.createElement('br'));
  });
  flushCode();
}

async function fetchJson(url, opts = {}) {
  // Electron 渲染进程是 file:// 协议，对 https://15code.com 是跨站请求，
  // SameSite=Lax 的 cookie 不会被带上。改用 Bearer token 走 Authorization 头。
  opts.headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (state.sessionToken && !opts.headers.Authorization) {
    opts.headers.Authorization = 'Bearer ' + state.sessionToken;
  }
  const r = await fetch(url, opts);
  const text = await r.text();
  let data;
  try { data = JSON.parse(text); } catch { data = { raw: text }; }
  if (!r.ok) {
    const error = new Error(data.error || data.detail || text || r.statusText);
    error.status = r.status;
    throw error;
  }
  return data;
}

function normalizeCatalogModel(model) {
  const capabilities = model?.capabilities || {};
  return {
    modelId: model?.id || model?.modelId || '',
    displayName: model?.displayName || model?.name || model?.id || model?.modelId || '',
    provider: model?.provider || '',
    family: model?.family || 'other',
    status: model?.status || 'available',
    recommended: Boolean(model?.recommended),
    sortOrder: Number.isFinite(Number(model?.sortOrder)) ? Number(model.sortOrder) : Number.MAX_SAFE_INTEGER,
    capabilities: {
      text: capabilities.text !== false,
      vision: Boolean(capabilities.vision),
      webSearch: Boolean(capabilities.webSearch),
      tools: Boolean(capabilities.tools),
    },
  };
}

function loadCachedCatalogModels() {
  try {
    const cached = JSON.parse(localStorage.getItem(CATALOG_CACHE_KEY) || 'null');
    if (cached?.schemaVersion !== SUPPORTED_CATALOG_SCHEMA_VERSION || !Array.isArray(cached.models)) return [];
    return cached.models.map(normalizeCatalogModel).filter(model => model.modelId);
  } catch {
    return [];
  }
}

async function refreshCatalogModels() {
  state.catalogWarning = null;
  try {
    const catalog = await fetchJson(CATALOG_URL);
    if (catalog.schemaVersion !== SUPPORTED_CATALOG_SCHEMA_VERSION) {
      const error = new Error('目录版本较新，请升级桌面客户端');
      error.catalogSchemaUnsupported = true;
      throw error;
    }
    const models = (catalog.models || [])
      .map(normalizeCatalogModel)
      .filter(model => model.modelId)
      .sort((a, b) => a.sortOrder - b.sortOrder || a.displayName.localeCompare(b.displayName, 'zh-CN'));
    if (!models.length) throw new Error('Catalog 未返回模型');
    state.models = models;
    localStorage.setItem(CATALOG_CACHE_KEY, JSON.stringify({
      schemaVersion: catalog.schemaVersion,
      generatedAt: catalog.generatedAt || null,
      models,
    }));
  } catch (error) {
    const cached = loadCachedCatalogModels();
    if (!cached.length) throw error;
    state.models = cached;
    state.catalogWarning = error.catalogSchemaUnsupported
      ? '目录版本较新，当前使用离线目录，请升级桌面客户端。'
      : 'Catalog 暂时不可用，当前使用上次成功的离线目录。';
  }
}

async function fetchStream(url, opts = {}) {
  opts.headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (state.sessionToken && !opts.headers.Authorization) {
    opts.headers.Authorization = 'Bearer ' + state.sessionToken;
  }
  const r = await fetch(url, opts);
  if (!r.ok) {
    const text = await r.text();
    let data;
    try { data = JSON.parse(text); } catch { data = { error: text }; }
    throw new Error(data.error || data.detail || text || r.statusText);
  }
  return r;
}

function parseSseFrame(frame) {
  let event = 'message';
  const data = [];
  frame.split(/\r?\n/).forEach(line => {
    if (line.startsWith('event:')) event = line.slice(6).trim() || 'message';
    if (line.startsWith('data:')) data.push(line.slice(5).trimStart());
  });
  return { event, data: data.join('\n') };
}

function extractStreamDelta(data) {
  if (!data || data === '[DONE]') return '';
  try {
    const parsed = JSON.parse(data);
    return parsed.choices?.[0]?.delta?.content || parsed.choices?.[0]?.message?.content || '';
  } catch {
    return '';
  }
}

function isNearChatBottom() {

async function doLogin(e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-err');
  err.style.display = 'none';
  btn.disabled = true;
  btn.textContent = '登录中...';

  try {
    const loginResp = await fetchJson(PLATFORM + '/api/auth/login', {
      method: 'POST',
      headers: { 'X-Auth-Mode': 'bearer' },
      body: JSON.stringify({ email, password }),
    });
    if (!loginResp.sessionToken) {
      throw new Error('服务端未返回 sessionToken（请确认服务端已升级到支持 X-Auth-Mode: bearer）');
    }
    state.sessionToken = loginResp.sessionToken;
    await window.desktop?.setSessionToken?.(state.sessionToken);

    // 主进程使用 safeStorage 保存 goKey，渲染层永远不接收或持有 Key。
    const account = await window.desktop.bootstrapAccount();
    state.user = account.user;
    state.apiCredentialReady = true;

    // 公共 Catalog 是模型名称、排序、状态和能力的唯一来源。
    await refreshCatalogModels();

    showApp();
    await restoreCurrentConversation();
  } catch (e) {
    err.textContent = '登录失败：' + e.message;
    err.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = '登录';
  }
  return false;
}

function logout() {
  const headers = state.sessionToken ? { 'Authorization': 'Bearer ' + state.sessionToken } : {};
  fetch(PLATFORM + '/api/auth/logout', { method: 'POST', headers }).finally(() => {
    state.user = null;
    state.apiCredentialReady = false;
    state.sessionToken = null;
    state.messages = [];
    state.attachments = [];
    state.chatImageMode = false;
    state.chatImageSource = null;
    state.lastChatImageSource = null;
    state.selectedImageAssetId = null;
    if (balanceRefreshTimer) {
      clearInterval(balanceRefreshTimer);
      balanceRefreshTimer = null;
    }
    window.desktop?.clearSessionToken?.();
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-page').style.display = 'flex';
  });
}

// ═══════════════════════ 显示主界面 ═══════════════════════
function showApp() {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('input').focus();

  // 填充模型下拉
  const sel = document.getElementById('model-pick');
  sel.replaceChildren();
  const groups = {};
  for (const m of state.models) {
    const group = getModelGroupName(m);
    if (!groups[group]) groups[group] = [];
    groups[group].push(m);
  }
  for (const [g, ms] of Object.entries(groups)) {
    const og = document.createElement('optgroup');
    og.label = g;
    for (const m of ms) {
      const op = document.createElement('option');
      op.value = m.modelId;
      const badges = [];
      if (m.recommended) badges.push('推荐');
      if (m.capabilities.vision) badges.push('图片');
      if (m.capabilities.webSearch) badges.push('联网');
      if (m.capabilities.tools) badges.push('工具');
      if (m.status !== 'available') badges.push(getModelStatusName(m.status));
      op.textContent = m.displayName + (badges.length ? ' · ' + badges.join(' · ') : '');
      op.disabled = m.status !== 'available';
      og.appendChild(op);
    }
    sel.appendChild(og);
  }
  // 默认选第一个
  if (state.models.length) {
    const available = state.models.filter(model => model.status === 'available');
    const saved = localStorage.getItem('15code:model');
    const fallback = available.find(model => model.recommended) || available[0];
    const chosen = available.find(model => model.modelId === saved) || fallback;
    if (chosen) sel.value = chosen.modelId;
    state.currentModel = sel.value;
  }
  sel.onchange = () => {
    state.currentModel = sel.value;
    localStorage.setItem('15code:model', sel.value);
    const heroModel = document.getElementById('hero-model');
    if (heroModel) heroModel.textContent = getModelName(sel.value);
  };
  const heroModel = document.getElementById('hero-model');
  if (heroModel) heroModel.textContent = getModelName(state.currentModel);

  if (state.catalogWarning) {
    const warning = state.catalogWarning;
    state.catalogWarning = null;
    setTimeout(() => window.alert(warning), 0);
  }

  refreshBalance();
  if (balanceRefreshTimer) clearInterval(balanceRefreshTimer);
  balanceRefreshTimer = setInterval(refreshBalance, 30000);  // 30s 刷余额
}

async function restoreCurrentConversation() {
  if (!window.desktop?.loadConversation) return;
  const conversation = await window.desktop.loadConversation(state.currentConversationId);
  if (!conversation) {
    await persistCurrentConversation();
    return;
  }
  state.messages = conversation.messages || [];
  state.currentDraft = conversation.draft || '';
  document.getElementById('input').value = state.currentDraft;
  renderMessages();
}

function getModelGroupName(model) {
  const familyNames = {
    openai: 'OpenAI / Codex',
    anthropic: 'Anthropic',
    zhipu: '智谱 AI',
    deepseek: 'DeepSeek',
    qwen: 'Qwen',
  };
  return familyNames[model.family] || model.provider || '其他';
}

function getModelStatusName(status) {
  if (status === 'maintenance') return '维护中';
  if (status === 'paused' || status === 'disabled') return '已暂停';
  return '不可用';
}

function getModelName(id) {
  const m = state.models.find(x => x.modelId === id);
  return m ? m.displayName : id;
}

async function refreshBalance() {
  try {
    const me = await fetchJson(PLATFORM + '/api/me');
    const credits = Number(me.user?.credits || 0) / 1_000_000;
    const box = document.getElementById('balance-box');
    box.replaceChildren(document.createTextNode('余额 '), makeElement('b', '', '$' + credits.toFixed(2)));
    if (credits < 1) box.style.color = 'var(--warn)';
  } catch (e) {
    console.warn('refreshBalance fail', e);
  }
}

    if (!selected?.ok) return;
    state.messages.push({

    await persistCurrentConversation();

function buildFallbackPptSlides(topic, count) {
  const base = [
    { title: topic, subtitle: 'AI 生成演示文稿', bullets: [], visualType: 'cover', notes: '开场介绍主题和目标。' },
    { title: '演示目标', subtitle: '', bullets: ['明确听众和决策目标', '聚焦最重要的业务问题', '用清晰结构组织材料'], visualType: 'content' },
    { title: '背景与现状', subtitle: '', bullets: ['行业环境正在变化', '现有流程存在效率瓶颈', '需要更稳定的交付方式'], visualType: 'content' },
    { title: '核心方案', subtitle: '', bullets: ['围绕目标设计内容结构', '自动生成页面和视觉元素', '导出可编辑 PPTX'], visualType: 'process' },
    { title: '关键能力', subtitle: '', bullets: ['文档理解', '页面规划', '图片生成', '风格统一', '讲稿生成'], visualType: 'matrix' },
    { title: '实施路径', subtitle: '', bullets: ['第一阶段完成生成闭环', '第二阶段支持 PPT 美化', '第三阶段接入企业模板库'], visualType: 'timeline' },
    { title: '预期收益', subtitle: '', bullets: ['降低制作时间', '提升表达质量', '增强交付一致性'], visualType: 'chart' },
    { title: '风险与控制', subtitle: '', bullets: ['内容需人工确认', '图片需统一风格', '关键数据保留来源'], visualType: 'content' },
    { title: '下一步', subtitle: '', bullets: ['确认目标模板', '接入图片生成接口', '完成打包测试'], visualType: 'closing' },
  ];
  while (base.length < count) {
    base.splice(base.length - 1, 0, {
      title: `补充页面 ${base.length}`,
      subtitle: '',
      bullets: ['补充关键事实', '增加案例或数据', '强化结论表达'],
      visualType: 'content',
    });
  }
  return base.slice(0, count);
}

function extractJsonObject(text) {
  const raw = String(text || '').trim();
  const fenced = raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
  const candidate = fenced ? fenced[1] : raw;
  const start = candidate.indexOf('{');
  const end = candidate.lastIndexOf('}');
  if (start < 0 || end < start) throw new Error('AI 没有返回 JSON');
  return JSON.parse(candidate.slice(start, end + 1));
}

function normalizePptSlidesFromAi(data, topic, count) {
  const slides = Array.isArray(data?.slides) ? data.slides : [];
  const normalized = slides.map((s, i) => ({
    title: String(s.title || `第 ${i + 1} 页`).trim(),
    subtitle: String(s.subtitle || '').trim(),
    bullets: Array.isArray(s.bullets) ? s.bullets.map(x => String(x).trim()).filter(Boolean).slice(0, 5) : [],
    visualType: String(s.visualType || (i === 0 ? 'cover' : 'content')).trim(),
    notes: String(s.notes || '').trim(),
  })).filter(s => s.title);
  return normalized.length ? normalized.slice(0, count) : buildFallbackPptSlides(topic, count);
}

function buildPptSlidesFromImported(info, topic) {
  const imported = Array.isArray(info?.slides) ? info.slides : [];
  const slides = imported.map((item, index) => {
    const fragments = String(item?.text || '').split('|').map(value => value.trim()).filter(Boolean);
    const title = fragments.shift() || `第 ${index + 1} 页`;
    return {
      title: title.slice(0, 48),
      subtitle: index === 0 ? '基于原始 PPT 的可编辑优化稿' : '',
      bullets: fragments.slice(0, 5).map(value => value.slice(0, 80)),
      visualType: index === 0 ? 'cover' : index === imported.length - 1 ? 'closing' : 'content',
      notes: '基于原始页面内容重构；请在导出前确认事实、数字和专有名词。',
    };
  }).filter(slide => slide.title);
  return slides.length ? slides : buildFallbackPptSlides(topic, 8);
}

function pptQualityReport(slides) {
  const issues = [];
  const titles = new Map();
  slides.forEach((slide, index) => {
    const page = index + 1;
    const title = String(slide.title || '').trim();
    if (!title) issues.push(`第 ${page} 页没有标题。`);
    if (title.length > 32) issues.push(`第 ${page} 页标题过长（${title.length} 字），建议压缩为结论句。`);
    if ((slide.bullets || []).length > 5) issues.push(`第 ${page} 页要点超过 5 条。`);
    (slide.bullets || []).forEach((bullet, bulletIndex) => {
      if (String(bullet).trim().length > 46) issues.push(`第 ${page} 页第 ${bulletIndex + 1} 条过长，导出时可能拥挤。`);
    });
    const key = title.replace(/\s+/g, '').toLowerCase();
    if (key) {
      if (titles.has(key)) issues.push(`第 ${page} 页标题与第 ${titles.get(key)} 页重复。`);
      else titles.set(key, page);
    }
  });
  if (!slides.length) issues.push('还没有可检查的页面。');
  return issues;
}

function checkPptQuality() {
  const issues = pptQualityReport(state.pptSlides);
  const report = issues.length
    ? `导出前发现 ${issues.length} 项可优化内容：\n${issues.map((issue, index) => `${index + 1}. ${issue}`).join('\n')}`
    : '质量检查通过：标题、页数、要点数量和重复项均符合当前基础规则。';
  document.getElementById('ppt-report').textContent = report;
  setPptStatus(issues.length ? `质量检查完成：发现 ${issues.length} 项可优化内容。` : '质量检查通过，可以导出 PPTX。');
  return issues;
}

async function generatePptImages() {
  const btn = document.getElementById('ppt-image-btn');
  const topic = document.getElementById('ppt-topic').value.trim() || '15code PPT Studio';
  const scenario = document.getElementById('ppt-scenario').value;
  const style = document.getElementById('ppt-style').value;
  const model = getPptImageModel();
  const quality = document.getElementById('ppt-image-engine').value;
  if (!model) {
    setPptStatus('已选择不生成图片。');
    return;
  }
  if (!state.sessionToken) {
    setPptStatus('请先登录后再生成图片。');
    return;
  }
  if (!state.pptSlides.length) {
    state.pptSlides = buildFallbackPptSlides(topic, Number(document.getElementById('ppt-page-count').value || 10));
    renderPptSlides();
  }

  const prompts = state.pptSlides.map((slide, index) => ({
    index,
    title: slide.title,
    prompt: buildPptImagePrompt(slide, index, topic, style, scenario),
  }));

  btn.disabled = true;
  setPptStatus(`正在通过 15code 图片服务生成 ${prompts.length} 张 PPT 配图...`);
  try {
    const images = [];
    // 顺序提交：每张图均经由用户自己的 15code API Key、权限和图片预约计费
    // 链路；避免一次并发 15 张造成重复扣费、账户限流或浏览器内存突刺。
    for (let position = 0; position < prompts.length; position += 1) {
      const item = prompts[position];
      setPptStatus(`正在通过 15code 图片服务生成第 ${position + 1}/${prompts.length} 张配图...`);
      const result = await window.desktop.generateImage({
        model,
        prompt: item.prompt,
        size: '1536x1024',
        quality,
        format: 'png',
        clientRequestId: 'ppt-img-' + crypto.randomUUID(),
      });
      if (!result?.dataUrl) throw new Error(`第 ${position + 1} 张配图没有返回图片数据`);
      const image = { index: item.index, dataUrl: result.dataUrl, model, prompt: item.prompt, usage: result.usage || null };
      images.push(image);
      state.pptImages[image.index] = image;
      renderPptSlides();
    }
    setPptStatus(`已通过 15code 图片服务生成 ${images.length} 张配图，可直接导出 PPTX。`);
  } catch (e) {
    setPptStatus('生成配图失败：' + e.message);
  } finally {
    btn.disabled = false;
  }
}

// ═══════════════════════ 聊天 ═══════════════════════
function newChat() {
  void persistCurrentConversation();
  showChatMode();
  state.currentConversationId = crypto.randomUUID();
  localStorage.setItem('15code:conversation', state.currentConversationId);
  state.currentDraft = '';
  state.messages = [];
  state.attachments = [];
  state.chatImageSource = null;
  state.lastChatImageSource = null;
  state.selectedImageAssetId = null;
  // A request from the previous conversation is tracked separately and will finish
  // there; the newly created conversation itself is immediately usable.
  state.chatImageBusy = false;
  renderMessages();
  renderAttachments();
  document.getElementById('input').value = '';
  renderChatImageMode();
  document.getElementById('input').focus();
  void persistCurrentConversation();
}

function conversationTitle() {
  const first = state.messages.find(message => message.role === 'user' && message.content?.trim());
  const text = (first?.content || '新对话').replace(/\s+/g, ' ').trim();
  return text.length > 36 ? text.slice(0, 36) + '…' : text;
}

function persistConversationSnapshot(snapshot) {
  if (!window.desktop?.saveConversation || !snapshot?.id) return;
  // Serialize every conversation write, including a result that finishes after the
  // user has switched conversations. This keeps an older image operation from writing
  // its final state into whichever conversation happens to be active at that moment.
  const save = conversationSaveQueue.then(() => window.desktop.saveConversation(snapshot));
  conversationSaveQueue = save.catch(() => {});
  return save;
}

function snapshotCurrentConversation() {
  if (!state.currentConversationId) return null;
  return {
    id: state.currentConversationId,
    title: conversationTitle(),
    model: state.currentModel,
    draft: document.getElementById('input')?.value || state.currentDraft || '',
    messages: state.messages.map(message => ({ ...message, image: message.image ? { ...message.image } : undefined })),
  };
}

function persistCurrentConversation() {
  // Snapshot now, then serialize the write. A draft timer, a streaming response, an
  // image result and the quit flush must never delete/rewrite each other's messages.
  return persistConversationSnapshot(snapshotCurrentConversation());
}

async function openConversation(id) {
  await persistCurrentConversation();
  const conversation = await window.desktop.loadConversation(id);
  if (!conversation) return alert('会话不存在或已被删除');
  state.currentConversationId = id;
  localStorage.setItem('15code:conversation', id);
  state.messages = conversation.messages || [];
  state.chatImageSource = null;
  state.lastChatImageSource = null;
  state.selectedImageAssetId = null;
  // An image operation may still be finalizing for the conversation we just left.
  // Its completion is bound to that conversation and must not make this one look busy.
  state.chatImageBusy = false;
  state.currentDraft = conversation.draft || '';
  if (conversation.model && state.models.some(model => model.modelId === conversation.model && model.status === 'available')) {
    state.currentModel = conversation.model;
    document.getElementById('model-pick').value = conversation.model;
  }
  document.getElementById('input').value = state.currentDraft;
  showChatMode();
  renderMessages();
}

async function showConversationManager() {
  const query = prompt('搜索会话标题（留空显示全部；输入“最近删除”恢复会话）', '') || '';
  const deleted = query.trim() === '最近删除';
  const rows = await window.desktop.listConversations({ query: deleted ? '' : query, deleted });
  if (!rows.length) return alert(deleted ? '最近没有删除的会话' : '没有找到会话');
  const choice = prompt(rows.map((row, index) => `${index + 1}. ${row.pinned ? '📌 ' : ''}${row.title}`).join('\n')
    + (deleted ? '\n\n输入序号恢复' : '\n\n输入序号管理'));
  const row = rows[Number(choice) - 1];
  if (!row) return;
  if (deleted) {
    await window.desktop.updateConversation({ id: row.id, deleted: false });
    return alert('会话已恢复');
  }
  const action = prompt('输入操作：打开 / 重命名 / 置顶 / 删除', '打开');
  if (action === '打开') return openConversation(row.id);
  if (action === '重命名') {
    const title = prompt('新标题', row.title);
    if (title?.trim()) await window.desktop.updateConversation({ id: row.id, title: title.trim() });
  } else if (action === '置顶') {
    await window.desktop.updateConversation({ id: row.id, pinned: !row.pinned });
  } else if (action === '删除') {
    await window.desktop.updateConversation({ id: row.id, deleted: true });
    if (row.id === state.currentConversationId) newChat();
  }
}

function renderMessages() {

    const model = makeElement('p', '', '当前模型：'); model.style.cssText = 'font-size:13px;margin-top:8px';
    const name = makeElement('b', '', getModelName(state.currentModel) || '加载中...'); name.id = 'hero-model'; model.appendChild(name); empty.appendChild(model);
    box.replaceChildren(empty);
    return;
  }
  box.replaceChildren();
  state.messages.forEach((m, i) => {
    const el = makeElement('div', 'msg ' + (m.role === 'user' ? 'user' : 'assistant'));
    const role = makeElement('div', 'msg-role ' + (m.role === 'user' ? 'user' : 'assistant'));
    role.appendChild(document.createTextNode(m.role === 'user' ? '👤 ' : '🤖 '));
    role.appendChild(makeElement('b', '', m.role === 'user' ? '你' : getModelName(state.currentModel)));
    el.appendChild(role);
    const body = makeElement('div', 'msg-body');
    if (m.type === 'image' && m.image) renderImageMessage(body, m, i); else renderMarkdownInto(body, m.content);
    el.appendChild(body);
    const actions = makeElement('div', 'msg-actions');
    const copy = makeElement('button', '', '复制'); copy.addEventListener('click', () => copyMsg(i)); actions.appendChild(copy);
    if (m.role !== 'user' && m.type !== 'image') {
      const regenerate = makeElement('button', '', '重新生成'); regenerate.addEventListener('click', () => regenMsg(i)); actions.appendChild(regenerate);
    }
    el.appendChild(actions);
    box.appendChild(el);
  });
  // scroll
  const area = document.getElementById('chat-area');
  area.scrollTop = area.scrollHeight;
}

function renderImageMessage(container, message, index) {
  const image = message.image || {};
  const card = makeElement('article', 'image-card' + (state.selectedImageAssetId === image.assetId ? ' selected' : ''));
  const header = makeElement('div', 'image-card-header');
  const kind = image.operation === 'edit' ? '已修改图片' : image.operation === 'import' ? '本地图片' : '已生成图片';
  header.appendChild(makeElement('span', '', kind));
  header.appendChild(makeElement('span', '', image.status === 'pending' ? '处理中…' : image.status === 'error' ? '失败' : `${image.size || ''} · ${String(image.format || '').toUpperCase()}`));
  card.appendChild(header);
  if (image.url && image.status !== 'error') {
    const img = document.createElement('img');
    img.src = image.url;
    img.alt = '15code 聊天图片';
    img.loading = 'lazy';
    img.referrerPolicy = 'no-referrer';
    img.addEventListener('error', () => { img.replaceWith(makeElement('div', 'image-card-caption', '图片文件已不可用或已被清理。')); });
    card.appendChild(img);
  }
  if (image.prompt) card.appendChild(makeElement('div', 'image-card-caption', image.prompt));
  if (image.error) card.appendChild(makeElement('div', 'image-card-caption', '失败：' + image.error));
  const actions = makeElement('div', 'image-card-actions');
  if (image.assetId && image.status === 'complete') {
    const modify = makeElement('button', '', '基于此图修改');
    modify.addEventListener('click', () => useImageAsChatSource(index)); actions.appendChild(modify);
    const select = makeElement('button', '', state.selectedImageAssetId === image.assetId ? '已选中' : '选中');
    select.addEventListener('click', () => { state.selectedImageAssetId = image.assetId; renderMessages(); }); actions.appendChild(select);
    const save = makeElement('button', '', '保存图片');
    save.addEventListener('click', () => saveChatImage(index)); actions.appendChild(save);
  }
  card.appendChild(actions);
  container.appendChild(card);
}

function useImageAsChatSource(index) {
  const message = state.messages[index];
  if (!message?.image?.assetId || message.image.status !== 'complete') return;
  state.selectedImageAssetId = message.image.assetId;
  state.chatImageSource = { assetId: message.image.assetId, url: message.image.url, name: '时间线图片', operation: message.image.operation };
  state.lastChatImageSource = state.chatImageSource;
  state.chatImageMode = true;
  setChatImageStatus('将基于所选时间线图片继续修改。');
  showChatMode();
  renderChatImageMode();
  renderMessages();
  document.getElementById('input').focus();
}

async function saveChatImage(index) {
  const image = state.messages[index]?.image;
  if (image?.status !== 'complete') return;
  const assetId = image.assetId;
  if (!assetId) return;
  try {
    const saved = await window.desktop?.saveChatImage?.({ conversationId: state.currentConversationId, assetId });
    if (saved?.ok) setChatImageStatus('已保存：' + saved.path);
  } catch (error) { setChatImageStatus('保存失败：' + error.message); }
}

function copyMsg(i) {
  navigator.clipboard.writeText(state.messages[i].content);
}

function regenMsg(i) {
  // 删除 i 之后的所有消息，重发
  state.messages = state.messages.slice(0, i);
  renderMessages();
  void persistCurrentConversation();
  sendToAssistant();
}

async function sendMessage() {
  if (state.streaming) {
    await cancelGeneration();
    return;
  }
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (state.chatImageMode) {
    await sendChatImageMessage(text);
    return;
  }
  if (!text && state.attachments.length === 0) return;

  // 组装用户消息（附件拼接）
  let userContent = text;
  if (state.attachments.length > 0) {
    const attachText = state.attachments.map(a =>
      `\n\n---\n**附件 ${a.name}**:\n\`\`\`\n${a.content}\n\`\`\``
    ).join('');
    userContent = (text || '请分析以下内容') + attachText;
  }

  state.messages.push({ id: crypto.randomUUID(), role: 'user', content: userContent, createdAt: Date.now() });
  state.attachments = [];
  renderAttachments();
  input.value = '';
  input.style.height = 'auto';
  renderMessages();

  await sendToAssistant();
}

async function sendChatImageMessage(prompt) {
  if (state.chatImageBusy || activeChatImageOperation) {
    setChatImageStatus('另一项图片操作正在完成，请稍候。');
    return;
  }
  if (!prompt) {
    setChatImageStatus(state.chatImageSource ? '请填写如何修改这张图片。' : '请描述要生成的图片。');
    return;
  }
  if (!window.desktop?.generateChatImage || !window.desktop?.editChatImage) {
    setChatImageStatus('当前桌面版本不支持聊天图片模式。');
    return;
  }
  const operationConversationId = state.currentConversationId;
  await persistCurrentConversation();
  // Awaiting the initial save permits a session switch. Do not start an image request
  // using the newly selected conversation while retaining the old UI state.
  if (state.currentConversationId !== operationConversationId) return;
  const input = document.getElementById('input');
  const source = state.chatImageSource;
  const options = chatImageOptions();
  const requestId = 'chat-img-' + crypto.randomUUID();
  const imageMessageId = crypto.randomUUID();
  const message = {
    id: imageMessageId, role: 'assistant', type: 'image', content: '', createdAt: Date.now(),
    image: {
      assetId: crypto.randomUUID(), operation: source ? 'edit' : 'generate', status: 'pending',
      format: options.format, mime: options.format === 'jpeg' ? 'image/jpeg' : `image/${options.format}`,
      size: options.size, quality: options.quality, prompt, sourceAssetId: source?.assetId || null, error: null,
    },
  };
  // The pending ID contains no image bytes. On success it is replaced with the
  // persisted asset ID; on failure it remains only as a metadata-only error card.
  state.messages.push({
    id: crypto.randomUUID(), role: 'user', content: (source ? '修改图片：' : '生成图片：') + prompt, createdAt: Date.now(),
  });
  state.messages.push(message);
  const operationMessages = state.messages;
  const operationModel = state.currentModel;
  state.chatImageBusy = true;
  let finishChatImageOperation;
  const thisChatImageOperation = new Promise(resolve => { finishChatImageOperation = resolve; });
  activeChatImageOperation = thisChatImageOperation;
  input.value = '';
  input.style.height = 'auto';
  setChatImageStatus(source ? '正在修改图片…' : '正在生成图片…');
  renderMessages();
  try {
    const result = source
      ? await window.desktop.editChatImage({ conversationId: state.currentConversationId, messageId: imageMessageId, sourceAssetId: source.assetId, prompt, ...options, clientRequestId: requestId })
      : await window.desktop.generateChatImage({ conversationId: state.currentConversationId, messageId: imageMessageId, prompt, ...options, clientRequestId: requestId });
    if (!result?.assetId || !result.url) throw new Error('图片服务没有返回可保存的图片');
    message.image = {
      assetId: result.assetId, operation: result.operation, status: 'complete', format: result.format,
      mime: result.mime, size: result.size || options.size, quality: result.quality || options.quality,
      prompt, sourceAssetId: result.sourceAssetId || source?.assetId || null, error: null, url: result.url,
    };
    if (state.currentConversationId === operationConversationId) {
      state.selectedImageAssetId = result.assetId;
      state.chatImageSource = { assetId: result.assetId, url: result.url, name: '最近生成结果', operation: result.operation };
      state.lastChatImageSource = state.chatImageSource;
      setChatImageStatus('已完成。可继续基于最近结果修改，或保存图片。');
    }
  } catch (error) {
    // Keep a metadata-only error card so a failed operation is visible after reload.
    // The pending asset ID is synthetic and never maps to a file or database row.
    message.image = {
      ...message.image,
      status: 'error',
      error: String(error?.message || '图片操作失败').slice(0, 500),
      url: null,
    };
    if (state.currentConversationId === operationConversationId) {
      state.selectedImageAssetId = null;
      setChatImageStatus((source ? '修改失败：' : '生成失败：') + error.message);
    }
  } finally {
    const finalized = ChatImageState.finalizeImageOperation({
      operationConversationId, imageMessageId, operationMessages, operationModel,
      finishedImage: message.image, currentConversationId: state.currentConversationId,
      currentMessages: state.messages, currentModel: state.currentModel,
      currentDraft: document.getElementById('input')?.value || state.currentDraft || '',
    });
    const { stillCurrentConversation, snapshot: operationSnapshot } = finalized;
    if (stillCurrentConversation) {
      state.messages = finalized.messages;
      state.chatImageBusy = false;
      renderMessages();
      renderChatImageMode();
    }
    try {
      await persistConversationSnapshot(operationSnapshot);
    } finally {
      finishChatImageOperation();
      if (activeChatImageOperation === thisChatImageOperation) activeChatImageOperation = null;
    }
    if (stillCurrentConversation) {
      refreshBalance();
      input.focus();
    }
  }
}

async function sendToAssistant() {
  state.streaming = true;
  state.stopRequested = false;
  const btn = document.getElementById('send-btn');
  btn.disabled = false;
  btn.textContent = '停止';

  // 占位消息
  state.messages.push({ id: crypto.randomUUID(), role: 'assistant', content: '', createdAt: Date.now() });
  const idx = state.messages.length - 1;
  renderMessages();

  const STREAM_RENDER_INTERVAL = 80;
  let renderTimer = null;
  let lastStreamRenderAt = 0;
  const renderAssistant = (final = false) => {
    if (renderTimer) {
      clearTimeout(renderTimer);
      renderTimer = null;
    }
    lastStreamRenderAt = performance.now();
    const last = document.querySelectorAll('#messages .msg').item(idx);
    if (last) {
      const body = last.querySelector('.msg-body');
      if (final) renderMarkdownInto(body, state.messages[idx].content || '');
      else body.textContent = state.messages[idx].content || '正在生成...';
    }
    if (isNearChatBottom()) {
      const area = document.getElementById('chat-area');
      area.scrollTop = area.scrollHeight;
    }
  };
  const queueAssistantRender = () => {
    if (renderTimer) return;
    const wait = Math.max(0, STREAM_RENDER_INTERVAL - (performance.now() - lastStreamRenderAt));
    renderTimer = setTimeout(() => {
      renderTimer = null;
      requestAnimationFrame(() => renderAssistant(false));
    }, wait);
  };

  try {
    if (!state.sessionToken) {
      throw new Error('登录状态已失效，请重新登录');
    }
    if (!state.currentModel) {
      throw new Error('请先选择模型');
    }

    const payload = {
      model: state.currentModel,
      messages: state.messages.slice(0, -1)
        .filter(message => message.type !== 'image' && String(message.content || '').trim())
        .map(message => ({ role: message.role, content: message.content })),
    };

    const last = document.querySelectorAll('#messages .msg').item(idx);
    if (last) last.querySelector('.msg-body').textContent = '正在判断是否需要搜索...';
    state.streamAbortController = new AbortController();
    const response = await fetchStream(PLATFORM + '/api/search-chat', {
      method: 'POST',
      signal: state.streamAbortController.signal,
      body: JSON.stringify({
        ...payload,
        searchMode: 'auto',
        stream: true,
      }),
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let sources = [];
    let streamError = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const frames = buffer.split(/\r?\n\r?\n/);
      buffer = frames.pop() || '';
      for (const frame of frames) {
        const parsed = parseSseFrame(frame);
        if (parsed.event === 'meta') {
          try {
            const meta = JSON.parse(parsed.data);
            sources = Array.isArray(meta.sources) ? meta.sources : [];
            if (!state.messages[idx].content && meta.searched) {
              const body = document.querySelectorAll('#messages .msg').item(idx)?.querySelector('.msg-body');
              if (body) body.textContent = '已搜索最新信息，正在生成...';
            }
          } catch {}
          continue;
        }
        if (parsed.event === 'error') {
          try { streamError = JSON.parse(parsed.data).error || parsed.data; }
          catch { streamError = parsed.data; }
          continue;
        }
        if (parsed.data === '[DONE]') break;
        const delta = extractStreamDelta(parsed.data);
        if (delta) {
          state.messages[idx].content += delta;
          queueAssistantRender();
        }
      }
    }

    if (streamError && !state.messages[idx].content) throw new Error(streamError);
    if (Array.isArray(sources) && sources.length > 0 && !/来源|Sources/i.test(state.messages[idx].content.slice(-500))) {
      state.messages[idx].content += '\n\n来源:\n' + sources
        .map(s => `[${s.id}] ${s.title}\n${s.url}`)
        .join('\n');
    }
    if (!state.messages[idx].content) state.messages[idx].content = '未返回内容';
    renderAssistant(true);
    return;
  } catch (e) {
    if (state.stopRequested || e.name === 'AbortError') {
      if (state.messages[idx].content) {
        state.messages[idx].content += '\n\n[已停止]';
        renderAssistant(true);
      } else {
        state.messages[idx].content = '[已停止]';
        renderMessages();
      }
    } else {
      state.messages[idx].content = '❌ 出错了：' + e.message;
      renderMessages();
    }
  } finally {
    state.streaming = false;
    state.currentRequestId = null;
    state.streamAbortController = null;
    btn.disabled = false;
    btn.textContent = '发送 →';
    refreshBalance();  // 聊天后立即刷新余额
    document.getElementById('input').focus();
    await persistCurrentConversation();
  }
}

async function cancelGeneration() {
  if (!state.streaming) return;
  state.stopRequested = true;
  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  btn.textContent = '停止中...';
  if (state.streamAbortController) {
    state.streamAbortController.abort();
  }
}

// ═══════════════════════ 附件 ═══════════════════════
function renderAttachments() {
  const box = document.getElementById('attachments');
  box.replaceChildren();
  state.attachments.forEach((a, i) => {
    const chip = makeElement('span', 'attach-chip');
    chip.appendChild(document.createTextNode('📎 ' + a.name + ' '));
    const remove = makeElement('span', 'x', '×');
    remove.setAttribute('role', 'button'); remove.tabIndex = 0;
    remove.addEventListener('click', () => removeAttachment(i));
    remove.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') removeAttachment(i); });
    chip.appendChild(remove);
    box.appendChild(chip);
  });
}
function removeAttachment(i) {
  state.attachments.splice(i, 1);
  renderAttachments();
}
function addAttachment(name, content) {
  // 截断过长
  const max = MAX_ATTACHMENT_CHARS;
  if (content.length > max) content = content.slice(0, max) + '\n\n...(文件太长，已截断到前 5 万字符)';
  state.attachments.push({ name, content });
  renderAttachments();
}

function isLikelyTextFile(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  return TEXT_FILE_EXTENSIONS.has(ext) || (file.type && file.type.startsWith('text/'));
}

async function readAttachmentFile(file) {
  if (file.size > MAX_ATTACHMENT_BYTES) {
    throw new Error(`${file.name} 超过 2MB，请拆分后再导入`);
  }
  if (!isLikelyTextFile(file)) {
    throw new Error(`${file.name} 不是支持的文本文件`);
  }

  const buffer = await file.arrayBuffer();
  const bytes = new Uint8Array(buffer);
  const sample = bytes.subarray(0, Math.min(bytes.length, 4096));
  if (sample.includes(0)) {
    throw new Error(`${file.name} 看起来是二进制文件`);
  }

  return new TextDecoder('utf-8', { fatal: false }).decode(buffer);
}

async function importAttachmentFiles(files) {
  for (const f of files) {
    try {
      addAttachment(f.name, await readAttachmentFile(f));
    } catch (e) {
      alert(e.message);
    }
  }
}

function openFileMenu() {
  // 用 <input type=file> 触发
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.multiple = true;
  inp.accept = '.txt,.md,.json,.csv,.py,.js,.ts,.go,.rs,.java,.html,.css,.log,.xml,.yml,.yaml,.sh,.sql,.c,.cpp,.h';
  inp.onchange = async (e) => {
    await importAttachmentFiles(e.target.files);
  };
  inp.click();
}

// 拖拽上传
document.addEventListener('dragover', e => { e.preventDefault(); });
document.addEventListener('drop', async e => {
  e.preventDefault();
  await importAttachmentFiles(e.dataTransfer.files);
});

// ═══════════════════════ 导出 ═══════════════════════
async function exportChat() {
  if (state.messages.length === 0) return alert('当前没有对话内容');
  const lines = state.messages.map(m => {
    const role = m.role === 'user' ? '## 👤 你' : '## 🤖 ' + getModelName(state.currentModel);
    return `${role}\n\n${m.content}\n`;
  });
  const content = `# 15code 对话记录\n\n导出时间: ${new Date().toLocaleString()}\n模型: ${getModelName(state.currentModel)}\n\n---\n\n` + lines.join('\n---\n\n');
  if (window.desktop) {
    await window.desktop.saveFile({
      content,
      defaultName: '15code-chat-' + new Date().toISOString().slice(0,16).replace(/[:T]/g,'-') + '.md',
    });
  } else {
    // 浏览器 fallback
    const blob = new Blob([content], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '15code-chat.md';
    a.click();
  }
}

// ═══════════════════════ 快捷键 / 初始化 ═══════════════════════
document.addEventListener('keydown', e => {
  const c = e.ctrlKey || e.metaKey;
  if (c && e.key === 'Enter') { sendMessage(); e.preventDefault(); }
  if (c && e.key === 'n') { newChat(); e.preventDefault(); }
  if (c && e.key === 's') { exportChat(); e.preventDefault(); }
  if (c && e.key === 'o') { openFileMenu(); e.preventDefault(); }
  if (c && e.key === 'p') { showPptStudio(); e.preventDefault(); }
});

// textarea 自动高度
document.getElementById('input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 180) + 'px';
  state.currentDraft = this.value;
  clearTimeout(draftSaveTimer);
  draftSaveTimer = setTimeout(() => void persistCurrentConversation(), 350);
});

// Electron 菜单事件
if (window.desktop) {
  window.desktop.onMenu('new-chat', () => newChat());
  window.desktop.onMenu('file-loaded', ({ name, content }) => addAttachment(name, content));
  window.desktop.onMenu('export', () => exportChat());
  window.desktop.onMenu('ppt-studio', () => showPptStudio());
  if (window.desktop.onUpdateStatus) {
    window.desktop.onUpdateStatus((status) => {
      const btn = document.getElementById('update-btn');
      if (!btn) return;
      btn.dataset.updateState = status.type || '';
      btn.title = status.message || '检查更新';
      if (status.type === 'checking') {
        btn.textContent = '检查中...';
        btn.disabled = true;
      } else if (status.type === 'available') {
        btn.textContent = '下载中...';
        btn.disabled = true;
      } else if (status.type === 'downloading') {
        btn.textContent = '更新 ' + (status.percent || 0) + '%';
        btn.disabled = true;
      } else if (status.type === 'downloaded') {
        btn.textContent = '安装更新';
        btn.disabled = false;
      } else if (status.type === 'catalog-available') {
        btn.textContent = status.mandatory ? '必须升级' : '下载 v' + status.version;
        btn.dataset.updateState = 'catalog-available';
        btn.disabled = false;
      } else if (status.type === 'error') {
        btn.textContent = '更新失败';
        btn.disabled = false;
        setTimeout(() => {
          if (btn.dataset.updateState === 'error') btn.textContent = '检查更新';
        }, 3500);
      } else {
        btn.textContent = '检查更新';
        btn.disabled = false;
      }
    });
  }
  window.desktop.onPrepareToQuit?.(async () => {
    if (quitFlushStarted) return;
    quitFlushStarted = true;
    clearTimeout(draftSaveTimer);
    try {
      // A generation already accepted by main owns an asynchronous asset write.  Wait
      // for its final serialized conversation save before acknowledging the close.
      await activeChatImageOperation;
      await persistCurrentConversation();
    } catch (error) {
      console.warn('Final conversation save failed during shutdown:', error);
    } finally {
      try { await window.desktop.acknowledgeQuitFlush?.(); } catch (error) { console.warn('Quit flush acknowledgement failed:', error); }
    }
  });
}

async function checkForUpdates() {
  const btn = document.getElementById('update-btn');
  if (btn?.dataset.updateState === 'downloaded') {
    await window.desktop?.installUpdate?.();
    return;
  }
  if (btn?.dataset.updateState === 'catalog-available') {
    await window.desktop?.installUpdate?.();
    return;
  }
  if (!window.desktop?.checkForUpdates) return;
  await window.desktop.checkForUpdates();
}


(async function showDesktopVersion() {
  try {
    if (!window.desktop?.getAppInfo) return;
    const info = await window.desktop.getAppInfo();
    const el = document.getElementById('app-version');
    if (el && info.version) el.textContent = 'v' + info.version;
    window.__chatLogPath = info.chatLogPath;
  } catch (e) {}
})();

// 启动时尝试恢复由 Electron safeStorage 保存的会话。
(async function bootstrap() {
  state.sessionToken = await window.desktop?.getSessionToken?.() || null;
  if (!state.sessionToken) return; // 没保存过 token，留在登录页
  try {
    const account = await window.desktop.bootstrapAccount();
    if (account.user && account.user.email) {
      state.user = account.user;
      state.apiCredentialReady = true;
      await refreshCatalogModels();
      showApp();
      await restoreCurrentConversation();
    }
  } catch (e) {
    // 仅在服务端明确拒绝凭证时清理；临时断网不销毁登录状态。
    if (e.status === 401 || e.status === 403) {
      state.sessionToken = null;
      await window.desktop?.clearSessionToken?.();
    }
  }
})();
